<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --text-muted: #9898ac;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.12);
      --gradient-1: #a78bfa;
      --gradient-2: #f472b6;
      --gradient-3: #fb923c;
      --gradient-4: #34d399;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .page-wrapper {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 80px 0 48px;
    }

    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(167, 139, 250, 0.2), 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 32px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .hero .tagline {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Mood mosaic decoration */
    .mosaic-strip {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 40px auto 0;
      flex-wrap: wrap;
      max-width: 360px;
    }

    .mosaic-dot {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      opacity: 0.85;
    }

    /* Features */
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px 0 48px;
    }

    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .feature-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .feature-icon {
      font-size: 1.6rem;
      margin-bottom: 12px;
      display: block;
    }

    .feature-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .feature-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 48px;
    }

    /* Support section */
    .support {
      text-align: center;
      padding-bottom: 80px;
    }

    .support h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .support p {
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 1rem;
    }

    .support-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid rgba(167, 139, 250, 0.2);
      transition: background 0.2s, border-color 0.2s;
    }

    .support-link:hover {
      background: rgba(167, 139, 250, 0.18);
      border-color: var(--accent);
    }

    .support-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px 0 48px;
      color: var(--text-muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 540px) {
      .hero { padding: 56px 0 36px; }
      .hero h1 { font-size: 2.2rem; }
      .hero .tagline { font-size: 1.05rem; }
      .features { grid-template-columns: 1fr; }
      .app-icon { width: 96px; height: 96px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
